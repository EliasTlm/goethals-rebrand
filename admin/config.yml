backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "instellingen"
    label: "Website Instellingen"
    files:
      - name: "algemeen"
        label: "Algemene informatie"
        file: "content/algemeen.json"
        fields:
          - { label: "Winkelnaam", name: "winkelnaam", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Opgericht in jaar", name: "opgericht", widget: "string" }
          - { label: "Adres", name: "adres", widget: "string" }
          - { label: "Telefoon", name: "telefoon", widget: "string" }
          - { label: "E-mail", name: "email", widget: "string" }
          - { label: "Facebook URL", name: "facebook", widget: "string" }

      - name: "openingstijden"
        label: "Openingstijden"
        file: "content/openingstijden.json"
        fields:
          - { label: "Maandag t/m vrijdag", name: "maandag_vrijdag", widget: "string", default: "08:00–18:30" }
          - { label: "Zaterdag", name: "zaterdag", widget: "string", default: "08:00–17:00" }
          - { label: "Zondag", name: "zondag", widget: "string", default: "Gesloten" }

      - name: "hero"
        label: "Hero sectie (bovenaan)"
        file: "content/hero.json"
        fields:
          - { label: "Grote titel (regel 1)", name: "titel1", widget: "string" }
          - { label: "Grote titel (regel 2, cursief)", name: "titel2", widget: "string" }
          - { label: "Subtitel", name: "subtitel", widget: "string" }

      - name: "over"
        label: "Over ons sectie"
        file: "content/over.json"
        fields:
          - { label: "Titel", name: "titel", widget: "string" }
          - { label: "Tekst alinea 1", name: "tekst1", widget: "text" }
          - { label: "Tekst alinea 2", name: "tekst2", widget: "text" }

  - name: "diensten"
    label: "Webshop categorieën"
    folder: "content/diensten"
    create: true
    slug: "{{naam}}"
    fields:
      - { label: "Naam", name: "naam", widget: "string" }
      - { label: "Emoji icoon", name: "icoon", widget: "string" }
      - { label: "Omschrijving", name: "omschrijving", widget: "text" }
      - { label: "Link URL", name: "url", widget: "string" }

  - name: "reviews"
    label: "Klantbeoordelingen"
    folder: "content/reviews"
    create: true
    slug: "{{auteur}}"
    fields:
      - { label: "Auteur", name: "auteur", widget: "string" }
      - { label: "Tekst", name: "tekst", widget: "text" }
      - { label: "Wanneer", name: "wanneer", widget: "string" }
      - { label: "Sterren (1-5)", name: "sterren", widget: "number", min: 1, max: 5 }
